name: Security and correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest --cov=backend --cov=connectors --cov=agents --cov-fail-under=85
      - run: ruff check backend connectors agents evaluations scripts tests
      - run: bandit -r backend connectors agents scripts -q
      - run: pip-audit -r requirements.txt
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=low
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser workflow
        run: |
          SF_DEMO=1 uvicorn backend.app:create_app --factory --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          cd frontend
          npm test
      - run: python -m evaluations.run
      - run: python -m scripts.publication_check
      - run: pip-audit -r requirements.txt -f cyclonedx-json -o /tmp/sentinelforge-sbom.json
      - run: docker build -t sentinelforge:test .
