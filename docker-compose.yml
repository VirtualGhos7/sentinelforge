services:
  sentinelforge:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SF_DEMO: "1"
      SF_DATABASE: sqlite:////data/sentinelforge.db
    volumes:
      - demo-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  demo-data:
